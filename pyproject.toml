[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportops-ai-copilot"
version = "0.1.0"
description = "A grounded IT support knowledge assistant with RAG evaluation, API security, feedback, and request logging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "langchain-core>=1.0",
  "langchain-text-splitters>=1.0",
  "langchain-chroma>=1.0",
  "langchain-ollama>=1.0",
  "chromadb>=1.0",
  "sentence-transformers>=3.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
